spring.application.name=ClassInsight

# ========================================
# CONFIGURAÇÕES DA APLICAÇÃO - CLASSINSIGHT
# ========================================

# Server Configuration
server.port=8080
server.servlet.context-path=/

# ========================================
# DATABASE CONFIGURATION (H2 - Development)
# ========================================
spring.datasource.url=jdbc:h2:mem:classinsight-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ========================================
# JPA/HIBERNATE CONFIGURATION
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Enable JPA Auditing
spring.data.jpa.repositories.enabled=true

# ========================================
# EMAIL CONFIGURATION
# ========================================
# SMTP Configuration (Gmail Example)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email From
spring.mail.properties.mail.from=noreply@classinsight.com

# ========================================
# ASYNC CONFIGURATION
# ========================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-

# ========================================
# SCHEDULER CONFIGURATION
# ========================================
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=scheduling-

# ========================================
# THYMELEAF CONFIGURATION (Email Templates)
# ========================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ========================================
# LOGGING CONFIGURATION
# ========================================
logging.level.br.com.grupo.ClassInsight=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Log Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ========================================
# OPENAPI/SWAGGER CONFIGURATION
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# API Info
springdoc.info.title=ClassInsight API
springdoc.info.description=API REST para Plataforma de Feedback Educacional
springdoc.info.version=1.0.0
springdoc.info.contact.name=ClassInsight Team
springdoc.info.contact.email=support@classinsight.com

# ========================================
# ACTUATOR CONFIGURATION
# ========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ========================================
# PERFORMANCE CONFIGURATION
# ========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Connection Pool
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
